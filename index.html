<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucy Learns</title>
    <meta
      name="description"
      content="A private training companion for Lucy. Practice what the trainer assigned, log it in seconds, and see what is actually improving."
    />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lucy Learns" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="visually-hidden" href="#app">Skip to content</a>

    <p id="storage-warning" class="storage-warning" role="alert" hidden>
      <strong>Sessions are not saving.</strong> This browser is blocking storage, most likely
      private browsing. Anything you log now will be lost when you close the tab.
    </p>

    <!-- A dedicated announcer says only the new screen's name. aria-live on
         the app container itself would queue up the whole screen for reading
         on every navigation. -->
    <p id="route-announcer" class="visually-hidden" role="status" aria-live="polite"></p>

    <main id="app"></main>

    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

    <p id="offline-note" class="offline-note" role="status" hidden>
      Offline. Your sessions are saved on this device.
    </p>

    <noscript>
      <div style="padding: 2rem; max-width: 34rem; margin: 0 auto">
        <h1>Lucy Learns</h1>
        <p>This app needs JavaScript to run the guided sessions.</p>
      </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
