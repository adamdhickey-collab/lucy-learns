<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucy Learns</title>
    <meta
      name="description"
      content="A private training companion for Lucy. Practice what the trainer assigned, log it in seconds, and see what is actually improving."
    />
    <meta name="theme-color" content="#f7f5ef" />
    <!-- Light by design. Declaring it stops native controls the app does not
         style, like the date picker, from rendering dark on light surfaces. -->
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lucy Learns" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <!-- iOS shows one of these while a Home Screen launch boots, matched on
         exact screen geometry. Same mark, same background, same position as the
         in-app splash, so the handoff has nothing to flash. Generated together
         with the images by scripts/make-splash.mjs into splash/links.html —
         regenerate and paste rather than editing these by hand. -->
    <!-- SE gen 2/3, 8 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="splash/apple-splash-750-1334.jpg"
    />
    <!-- 8 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1242-2208.jpg"
    />
    <!-- X, XS, 11 Pro, 12/13 mini -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1125-2436.jpg"
    />
    <!-- XR, 11 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="splash/apple-splash-828-1792.jpg"
    />
    <!-- XS Max, 11 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1242-2688.jpg"
    />
    <!-- 12, 13, 14 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1170-2532.jpg"
    />
    <!-- 12/13 Pro Max, 14 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1284-2778.jpg"
    />
    <!-- 14 Pro, 15, 15 Pro, 16 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1179-2556.jpg"
    />
    <!-- 14 Pro Max, 15 Plus, 15 Pro Max, 16 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1290-2796.jpg"
    />
    <!-- 16 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1206-2622.jpg"
    />
    <!-- 16 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="splash/apple-splash-1320-2868.jpg"
    />
    <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Painted by the browser before js/app.js parses, so the first frame is
         the mark rather than an empty page. app.js fades it out on its first
         animation frame; ?splash-hold keeps it up for design review.
         Inert to assistive tech: it is decoration over a loading app, and the
         real content is announced when the router paints. -->
    <div id="splash" class="splash" aria-hidden="true">
      <img class="splash-mark" src="img/splash-mark.jpg" alt="" />
      <p id="splash-version" class="splash-version"></p>
    </div>

    <a class="visually-hidden" href="#app">Skip to content</a>

    <p id="storage-warning" class="storage-warning" role="alert" hidden>
      <strong>Sessions are not saving.</strong> This browser is blocking storage, most likely
      private browsing. Anything you log now will be lost when you close the tab.
    </p>

    <!-- A dedicated announcer says only the new screen's name. aria-live on
         the app container itself would queue up the whole screen for reading
         on every navigation. -->
    <p id="route-announcer" class="visually-hidden" role="status" aria-live="polite"></p>

    <main id="app"></main>

    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

    <p id="offline-note" class="offline-note" role="status" hidden>
      Offline. Your sessions are saved on this device.
    </p>

    <noscript>
      <div style="padding: 2rem; max-width: 34rem; margin: 0 auto">
        <h1>Lucy Learns</h1>
        <p>This app needs JavaScript to run the guided sessions.</p>
      </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
