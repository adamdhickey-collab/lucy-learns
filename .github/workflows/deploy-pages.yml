# Deploy the site with GitHub Actions rather than the legacy Pages builder.
#
# The legacy builder started failing with a bare "Page build failed" and a
# duration of 0, i.e. it died before doing any work, on a repo with .nojekyll
# and no Liquid anywhere. This path is the supported one and, unlike legacy,
# it produces real logs when something breaks.
#
# There is nothing to build: the app is static, so this just uploads the repo.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
